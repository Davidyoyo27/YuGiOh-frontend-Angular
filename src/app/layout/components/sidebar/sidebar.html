<aside [class.collapsed]="isCollapsed()">
  <div class="cont-image">
    @if (isCollapsed()) {
      <img
        class="puzzle"
        src="assets/images/millennium-puzzle-v2.webp"
        alt="YuGiOh Logo"
        (click)="toggleSidebar()"
      />
    } @else {
      <img
        class="pyramid"
        src="assets/images/yugioh-logo-v2.webp"
        alt="YuGiOh Logo"
        (click)="toggleSidebar()"
      />
    }
  </div>
  <div>
    <nav>
      @if (authStore.isInitialized()) {
        @for (option of menu(); track option.route) {
          <a [routerLink]="option.route" routerLinkActive="active" class="menu-item">
            <i [class]="option.icon"></i>
            <span class="menu-text">{{ option.label }}</span>
          </a>
        }
      } @else {
        <p>Cargando menú...</p>
      }
      <button (click)="logout()" class="menu-item">
        <i class="pi pi-sign-out" style="color: var(--color-type-red)"></i>
        <span class="menu-text" style="color: var(--color-type-red)">Cerrar Sesión</span>
      </button>
    </nav>
  </div>
</aside>
