<aside
  [class.collapsed]="isCollapsed()"
  [class.player-menu]="isPlayer()"
  [class.admin-menu]="isAdmin()"
  [class.superadmin-menu]="isSuperAdmin()"
>
  <div class="cont-image">
    @if (isCollapsed()) {
      <img
        class="puzzle"
        src="assets/images/millennium-puzzle-v2.webp"
        alt="YuGiOh Logo"
        (click)="toggleSidebar()"
      />
    } @else {
      <img
        class="pyramid"
        src="assets/images/yugioh-logo-v2.webp"
        alt="YuGiOh Logo"
        (click)="toggleSidebar()"
      />
    }
  </div>

  <div class="menu-content">
    <button
      class="sidebar-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed() ? 'Abrir menú' : 'Cerrar menú'"
    >
      <i [class]="isCollapsed() ? 'pi pi-bars' : 'pi pi-times'"></i>
    </button>
    <nav>
      @if (authStore.isInitialized()) {
        @for (option of menu(); track option.route) {
          <a [routerLink]="option.route" routerLinkActive="active" class="menu-item">
            <i [class]="option.icon"></i>
            <span class="menu-text">{{ option.label }}</span>
          </a>
        }
      } @else {
        <p>Cargando menú...</p>
      }
      <button (click)="logout()" class="menu-item">
        <i class="pi pi-sign-out"></i>
        <span class="menu-text">Cerrar Sesión</span>
      </button>
    </nav>
  </div>
</aside>
