<main>
  <div class="content-logo">
    <img src="assets/images/eye-of-ra.png" alt="YuGiOh Logo" />
    <h1 for="">Estadísticas de Duelo</h1>
  </div>
  <div class="content">
    <div class="content-box">
      <p-toast />
      <h1>Crear cuenta</h1>
      <p>Empieza a llevar el control de tus duelos</p>
      <div class="input-box">
        <input [(ngModel)]="name" type="text" placeholder="Nombre" />
        <input [(ngModel)]="lastName" type="text" placeholder="Apellido" />
        <input [(ngModel)]="email" type="email" placeholder="Correo electronico" />
        <input [(ngModel)]="password" type="password" placeholder="Contraseña" />
        <input [(ngModel)]="passwordConfirm" type="password" placeholder="Confirmar contraseña" />
      </div>
      @for (error of errorData(); track error.textError) {
        <div class="error-box">
          <li>{{ error.textError }}</li>
        </div>
      }
      <button type="button" (click)="createUser()">
        @if (isLoading()) {
          <span>Cargando...</span>
        } @else {
          <span>Registrarme</span>
        }
      </button>
    </div>
    <div class="link-box">
      <label for="">¿Ya tienes cuenta?</label>
      <a routerLink="/login">Iniciar sesión</a>
    </div>
  </div>
</main>
