<div class="container">
  <div class="cont-principal-text">
    <h1>¿Qué quieres editar?</h1>
    <p>Elige la sección que deseas actualizar en tu perfil.</p>
  </div>
  <div class="cont-boxs">
    <div class="cont-links">
      <a routerLink="/player-perfil/edit-options/edit-user-account" class="setting-card">
        <div class="card-left">
          <div class="card-icon">
            <i class="pi pi-user" style="font-size: 2rem"></i>
          </div>
          <div class="card-info">
            <h3>Información personal</h3>
            <p>Actualiza tus datos personales.</p>
          </div>
        </div>
        <i class="pi pi-angle-right" style="font-size: 1.3rem"></i>
      </a>
      <a routerLink="/home" class="setting-card">
        <div class="card-left">
          <div class="card-icon">
            <i class="pi pi-id-card" style="font-size: 2rem"></i>
          </div>
          <div class="card-info">
            <h3>Perfil del jugador</h3>
            <p>Modifica los datos pertenecientes a tu perfil de jugador.</p>
          </div>
        </div>
        <i class="pi pi-angle-right" style="font-size: 1.3rem"></i>
      </a>
      <a routerLink="/home" class="setting-card">
        <div class="card-left">
          <div class="card-icon">
            <i class="pi pi-key" style="font-size: 2rem"></i>
          </div>
          <div class="card-info">
            <h3>Cambiar contraseña</h3>
            <p>Manten tu cuenta segura.</p>
          </div>
        </div>
        <i class="pi pi-angle-right" style="font-size: 1.3rem"></i>
      </a>
    </div>
    <a routerLink="/player-perfil" class="link-back-perfil">
      <i class="pi pi-arrow-left"></i>
      Volver al perfil
    </a>
  </div>
</div>
