<div class="wrapper">
  <div class="cont-text">
    <h1>Editar perfil</h1>
    <p>Actualiza tu perfil de usuario</p>
  </div>
  <div class="container">
    <p-toast />
    <div class="cont-inputs">
      <label for="">Nombre de usuario</label>
      <input [(ngModel)]="userName" type="text" />
      <label for="">Apellido</label>
      <input [(ngModel)]="userLastName" type="text" />
      <div class="cont-buttons">
        <button (click)="backToProfile()" class="button-reverse">Cancelar</button>
        <button (click)="saveChangesUserAccount()">Guardar</button>
      </div>
    </div>
  </div>
  <div class="divider">
    <span class="diamond"></span>
  </div>
  <div class="cont-text">
    <p>Actualiza tu perfil de jugador</p>
  </div>
  <div class="container">
    <div class="cont-inputs">
      <label for="">Apodo del jugador</label>
      <input [(ngModel)]="playerNickName" type="text" />
      <div class="cont-buttons">
        <button (click)="backToProfile()" class="button-reverse-v2">Cancelar</button>
        <button (click)="saveChangesProfile()" class="button-v2">Guardar</button>
      </div>
    </div>
  </div>
</div>
