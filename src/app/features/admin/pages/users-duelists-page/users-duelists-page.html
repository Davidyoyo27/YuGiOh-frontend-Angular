<div class="wrapper">
  <p-toast />
  <div class="cont-text">
    <h1>Administración de Jugadores</h1>
    <p>Encuentra al jugador que desees en el sistema.</p>
  </div>
  <div class="table-container">
    <div class="table-header">
      <input
        #searchInput
        type="text"
        placeholder="Buscar jugador..."
        (input)="table.filterGlobal(searchInput.value, 'contains')"
      />
    </div>

    <p-table
      class="dark-table"
      #table
      [value]="users()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 20, 50]"
      [globalFilterFields]="['name','email']"
      selectionMode="single"
      [(selection)]="selectedUser"
      dataKey="id"
    >
      <ng-template #header>
        <tr>
          <th>Correo</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Activo</th>
          <th>Tipo Usuario</th>
          <th>Acción</th>
        </tr>
      </ng-template>

      <ng-template #body let-user>
        <tr [pSelectableRow]="user">
          <td>{{ user.email }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.lastName }}</td>
          <td>{{ user.isActive ? 'Si' : 'No' }}</td>
          <td>{{ user.typeUser?.typeName }}</td>
          <td>
            <button
              type="button"
              pButton
              severity="secondary"
              variant="outlined"
              (click)="showOptions($event, user, op)"
            >
              Ver opciones
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
<!-- OPCIONES -->
<div>
  <p-popover #op>
    <div class="buttons-options">
      <button
        class="button-option"
        type="button"
        pButton
        severity="secondary"
        variant="outlined"
        size="small"
        (click)="op.hide(); sendActivationEmail()"
      >
        Enviar email de activación de cuenta
      </button>
      <button
        class="button-option"
        type="button"
        pButton
        severity="secondary"
        variant="outlined"
        size="small"
        (click)="op.hide(); blockUserAccount()"
      >
        Bloquear usuario
      </button>
      <button
        class="button-option"
        type="button"
        pButton
        severity="secondary"
        variant="outlined"
        size="small"
        (click)="op.hide(); unlockUserAccount()"
      >
        Desbloquear usuario
      </button>
    </div>
  </p-popover>
</div>
